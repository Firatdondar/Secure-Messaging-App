<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ my_name }} - Secure Node</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 20px;}
        .card { background-color: #111; border: 1px solid #333; margin-bottom: 20px; }
        .card-header { background-color: #222; border-bottom: 1px solid #00ff00; font-weight: bold; }
        .form-control { background-color: #000; color: #00ff00; border: 1px solid #444; }
        .form-control:focus { background-color: #111; color: #00ff00; border-color: #00ff00; box-shadow: none; }
        .btn-send { background-color: #004400; color: #00ff00; border: 1px solid #00ff00; }
        .btn-send:hover { background-color: #00ff00; color: #000; }
        .msg-box { border-left: 3px solid #00ff00; padding: 10px; margin-bottom: 10px; background-color: #1a1a1a; }
        .msg-danger { border-left: 3px solid #ff0000; color: #ff0000; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">=== {{ my_name }} ===</h2>
        <p class="text-center text-muted">Hedef Şifreli Ağ: 127.0.0.1:{{ target_port }}</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">TX / ŞİFRELE VE GÖNDER</div>
                    <div class="card-body">
                        <form id="sendForm">
                            <textarea id="msgInput" class="form-control mb-3" rows="3" placeholder="Gönderilecek metni yazın..." required></textarea>
                            <button type="submit" class="btn btn-send w-100">AES-128 İLE ŞİFRELE VE FIRLAT</button>
                        </form>
                        <div id="txLog" class="mt-3 text-muted" style="font-size: 0.8em;"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">RX / GELEN KUTUSU</div>
                    <div class="card-body" id="inbox" style="height: 300px; overflow-y: auto;">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mesaj Gönderme
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const log = document.getElementById('txLog');
            
            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input.value })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    log.innerHTML = `> BAŞARILI. Şifreli Paket:<br>${result.encrypted.substring(0, 40)}...`;
                    input.value = '';
                } else {
                    log.innerHTML = `> <span style="color:red">${result.message}</span>`;
                }
            } catch (err) {
                log.innerHTML = `> <span style="color:red">SİSTEM HATASI.</span>`;
            }
        });

        // Gelen Kutusunu 2 saniyede bir otomatik güncelle (Polling)
        setInterval(async () => {
            try {
                const response = await fetch('/api/inbox');
                const messages = await response.json();
                const inbox = document.getElementById('inbox');
                inbox.innerHTML = '';
                
                messages.forEach(msg => {
                    const dangerClass = msg.status === 'TEHLİKE!' ? 'msg-danger' : '';
                    inbox.innerHTML += `
                        <div class="msg-box ${dangerClass}">
                            <small>[Şifreli Yük: ${msg.raw_payload}]</small><br>
                            <strong>ÇÖZÜLEN METİN:</strong> ${msg.content}
                        </div>
                    `;
                });
            } catch (err) { }
        }, 2000);
    </script>
</body>
</html>
